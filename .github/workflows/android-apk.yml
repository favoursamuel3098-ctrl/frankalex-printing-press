name: Build Android APK v2.1.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v2.1.0'

permissions:
  contents: write

env:
  APP_VERSION: 2.1.0
  APP_VERSION_CODE: 21

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Set Android version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('versionCode 1', 'versionCode 21')
          s = s.replace('versionName "1.0"', 'versionName "2.1.0"')
          p.write_text(s)
          PY

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Frank-Alex-Printing-Press-v2.1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frank-Alex-Printing-Press-v2.1.0
          path: Frank-Alex-Printing-Press-v2.1.0.apk
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v2.1.0')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: Frank Alex Printing Press v2.1.0
          generate_release_notes: true
          files: Frank-Alex-Printing-Press-v2.1.0.apk

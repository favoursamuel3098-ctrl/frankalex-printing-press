name: Build Android APK v2.1.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v2.1.0'

permissions:
  contents: write

env:
  APP_VERSION: 2.1.0
  APP_VERSION_CODE: 21
  WEB_APP_URL: https://frank-alex-printing-press-saf2e0.v2.appdeploy.ai/

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create standalone mobile shell
        shell: bash
        run: |
          rm -rf mobile-build
          mkdir -p mobile-build/www
          cd mobile-build
          npm init -y
          npm install --no-audit --no-fund @capacitor/cli@7.4.3 @capacitor/core@7.4.3 @capacitor/android@7.4.3
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.frankalex.printingpress",
            "appName": "Frank Alex Printing Press",
            "webDir": "www",
            "server": {
              "url": "${WEB_APP_URL}",
              "cleartext": false
            }
          }
          EOF
          cat > www/index.html <<EOF
          <!doctype html>
          <html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frank Alex Printing Press</title></head>
          <body><p>Loading Frank Alex Printing Press…</p><script>window.location.replace(${WEB_APP_URL@Q});</script></body></html>
          EOF
          npx cap add android
          npx cap sync android

      - name: Set Android version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile-build/android/app/build.gradle')
          s = p.read_text()
          s = s.replace('versionCode 1', 'versionCode 21')
          s = s.replace('versionName "1.0"', 'versionName "2.1.0"')
          p.write_text(s)
          PY

      - name: Make Gradle executable
        run: chmod +x mobile-build/android/gradlew

      - name: Build debug APK
        working-directory: mobile-build/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp mobile-build/android/app/build/outputs/apk/debug/app-debug.apk Frank-Alex-Printing-Press-v2.1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frank-Alex-Printing-Press-v2.1.0
          path: Frank-Alex-Printing-Press-v2.1.0.apk
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v2.1.0')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: Frank Alex Printing Press v2.1.0
          generate_release_notes: true
          files: Frank-Alex-Printing-Press-v2.1.0.apk
